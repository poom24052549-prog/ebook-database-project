{% extends 'base.html' %}

{% block title %}สมัครสมาชิก - E-Book Store{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus text-primary" style="font-size: 3.5rem;"></i>
                <h3 class="fw-bold mt-2">สมัครสมาชิกใหม่</h3>
                <p class="text-muted small">สร้างบัญชีเพื่อเลือกซื้อและสะสม E-Book ในคลังส่วนตัว</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="full_name" class="form-label fw-semibold">ชื่อ - นามสกุล <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="เช่น นายสมใจ ดีเลิศ" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-semibold">ชื่อผู้ใช้ (Username) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="เช่น somjai99" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">เบอร์โทรศัพท์</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="08xxxxxxxx">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">อีเมล <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">รหัสผ่าน <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label fw-semibold">ยืนยันรหัสผ่าน <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill shadow-sm mb-3">
                    <i class="bi bi-check2-circle me-2"></i>สร้างบัญชีสมาชิก
                </button>
            </form>

            <div class="text-center mt-3">
                <span class="text-muted small">มีบัญชีอยู่แล้ว? </span>
                <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">เข้าสู่ระบบที่นี่</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
